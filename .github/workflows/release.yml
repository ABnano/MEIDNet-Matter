name: release

# A GitHub release for every v* tag: the wheel and sdist (with the built frontend inside), the frontend as a zip,
# and a check that the Space's Docker image builds; then the same Python distributions go to PyPI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the package
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m pip wheel ./engine --no-deps -w dist/        # the engine wheel ships with every release
          python -m twine check --strict dist/*
      - name: The tag is the version, everywhere
        if: github.event_name == 'push'
        run: |
          v=$(python -c "import matter; print(matter.__version__)")
          test "${GITHUB_REF_NAME#v}" = "$v" || { echo "tag $GITHUB_REF_NAME is not version $v"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          grep -q "^version: \"$v\"" CITATION.cff || { echo "CITATION.cff is not at $v"; exit 1; }
          unzip -l dist/meidnet_matter-*.whl | grep -q "matter/static/index.html"     # the application wheel carries the built site
          test -f dist/meidnet-*.whl                                                 # the engine wheel ships beside it
      - name: The wheel runs outside the repository
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ./engine
          python -m pip install "$(ls dist/meidnet_matter-*.whl)[judge]"       # with the judge: constraints.txt pins its stack too
          cd "$RUNNER_TEMP"
          meidnet-matter version
          python -c "import matter.app"
      - name: The known-good versions (this very install), a release asset the install command can pin to
        run: |
          v=$(python -c "import matter; print(matter.__version__)")
          { echo "# MEIDNet Matter $v: every dependency at the version the release's own install check used"
            echo "# (Linux, Python $(python -c 'import sys; print("%d.%d" % sys.version_info[:2])'), CPU torch, $(date -u +%Y-%m-%d))."
            echo "# pip install --extra-index-url https://download.pytorch.org/whl/cpu -c <this file> \"meidnet-matter[judge]\""
            python -m pip freeze --exclude-editable | grep -v -E '^(meidnet|meidnet-matter)[= @]' | grep -v ' @ ' | sed -E 's/\+cpu$//'
          } > dist/constraints.txt
          test "$(grep -c '==' dist/constraints.txt)" -gt 40
      - name: Frontend zip
        run: |
          v=$(python -c "import matter; print(matter.__version__)")
          (cd matter/static && zip -qr "$GITHUB_WORKSPACE/dist/meidnet-matter-frontend-$v.zip" .)
      - name: Model file and Docker image
        run: |
          python scripts/fetch_assets.py --only perov5-2k
          python deploy/deploy_space.py --dry-run     # tolerant: the other checkpoints are release assets of this very tag
          docker build --build-arg PREFETCH_WEIGHTS=0 -t meidnet-matter:ci build/space_docker
      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk "/^## \[$v\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "MEIDNet Matter $v" --notes-file notes.md
      - name: The Python distributions for PyPI (not the frontend zip), one folder per project
        if: github.event_name == 'push'
        run: |
          mkdir -p pypi/engine pypi/app
          cp dist/meidnet-[0-9]*.whl pypi/engine/
          cp dist/meidnet_matter-*.whl dist/meidnet_matter-*.tar.gz pypi/app/
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: pypi
          path: pypi/

  pypi:
    # PyPI trusted publishing, no token stored anywhere. On pypi.org the projects meidnet-matter (the application) and
    # meidnet (the engine wheel Matter needs) each list ABnano/MEIDNet-Matter, this file (release.yml) and the environment
    # "pypi" as a publisher; a token is scoped to one project, so each project is uploaded by its own step. Until the
    # publishers exist this job fails on its own and the GitHub release above is unaffected; once they do, "Re-run failed
    # jobs" on the tag's run uploads the files.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/meidnet-matter/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi
          path: dist/
      - name: The application (project meidnet-matter)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/app/
          skip-existing: true
      - name: The engine (project meidnet)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/engine/
          skip-existing: true      # the engine wheel is shared by app releases until the engine's version moves
