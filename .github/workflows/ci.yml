name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch, the vendored engine, Matter)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ./engine
          pip install -e ".[dev]"
      - name: The engine snapshot is coherent
        run: |
          python -c "import meidnet, meidnet.symmetry; assert meidnet.__version__.startswith('2.4.0'), meidnet.__version__"
          meidnet --version && python -m meidnet --version
          python -m meidnet_eval.stages --validate
      - name: Model files (cached by checksum)
        uses: actions/cache@v4
        with:
          path: checkpoints
          key: matter-checkpoints-f9493781-205de8b8
      - run: python scripts/fetch_assets.py --only perov5-2k
      - name: Tests
        run: python -m pytest -q -m "not browser and not network"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: matter/static

  mirror:
    # the static mirror (GitHub Pages) builds on every push, so a change that would break it fails here, not for visitors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: The mirror's frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build:mirror
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ./engine
          pip install -e .
      - name: Pre-render the read-only API (refuses server paths and paths rooted at /)
        run: python scripts/build_mirror.py --out build/mirror

  smoke:
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ./engine
          pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: matter/static
      - uses: actions/cache@v4
        with:
          path: checkpoints
          key: matter-checkpoints-f9493781-205de8b8
      - run: python scripts/fetch_assets.py --only perov5-2k
      - name: Start the server with the demo
        run: |
          MATTER_PUBLIC=1 MATTER_RUN_ROOT=$RUNNER_TEMP/runs python -m uvicorn matter.app:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          curl --retry 40 --retry-delay 2 --retry-connrefused -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/api/projects/perov5-demo | python -c "import json,sys; d=json.load(sys.stdin); assert d['project_id']=='perov5-demo'"
      - name: Browser walk-through (acceptance test A)
        run: node scripts/smoke_browser.mjs http://127.0.0.1:8000 build/smoke
        env:
          BROWSER: /usr/bin/google-chrome
      - if: always()
        run: cat server.log | tail -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: build/smoke
