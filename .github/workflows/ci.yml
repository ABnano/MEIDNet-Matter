name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch, the engine from PyPI, Matter)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Model files (cached by checksum)
        uses: actions/cache@v4
        with:
          path: checkpoints
          key: matter-checkpoints-f9493781-205de8b8
      - run: python scripts/fetch_assets.py
      - name: Tests
        run: python -m pytest -q -m "not browser and not network"
